<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- PAGE -->
<title>The Witch, Up Close</title>
<style>
  /* A single dark look: Wren's cottage by firelight, with the witch on a turntable. */
  :root {
    color-scheme: dark;
    --night: #0b0710;
    --panel: rgba(24, 12, 30, 0.88);
    --plum: #3a1631;
    --cream: #ecdcb8;
    --ink: #f3ead8;
    --dim: #b9a9c4;
    --magenta: #c63d83;
    --gold: #e2bd67;
    --display: 'Jacquard 12', 'Georgia', serif;
    --body: 'Pixelify Sans', 'Trebuchet MS', system-ui, sans-serif;
    --gutter: max(16px, env(safe-area-inset-left, 0px));
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; color: var(--ink); background: var(--night); }
  body { font: 15px/1.4 var(--body); -webkit-user-select: none; user-select: none; }
  #backdrop { position: fixed; inset: 0; background: var(--night) var(--room) center / cover no-repeat; filter: blur(3px) brightness(0.45) saturate(0.9); transform: scale(1.04); }
  #shade { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 55%, transparent 25%, rgba(8, 4, 12, 0.85) 80%); }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; opacity: 0; transition: opacity 0.8s; }
  #stage.pixelated { image-rendering: pixelated; }
  body.ready #stage { opacity: 1; }
  header { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: var(--gutter); right: var(--gutter); pointer-events: none; text-shadow: 0 2px 0 #000; }
  h1 { margin: 0; font: 400 clamp(38px, 6vw, 58px)/0.95 var(--display); color: var(--cream); }
  header p { margin: 6px 0 0; max-width: 46ch; color: var(--dim); font-size: 14px; }
  #panel { position: fixed; left: var(--gutter); right: var(--gutter); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; max-width: 720px;
    display: grid; gap: 10px; padding: 14px 16px; background: var(--panel); border: 2px solid var(--cream); border-radius: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row b { width: 54px; font-weight: 400; color: var(--gold); font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; }
  button { font: inherit; font-size: 14px; color: var(--ink); cursor: pointer; padding: 6px 12px; background: rgba(58, 22, 49, 0.9); border: 1px solid rgba(236, 220, 184, 0.5); border-radius: 6px; }
  button:hover { border-color: var(--cream); }
  button[aria-pressed='true'] { background: var(--magenta); border-color: var(--cream); color: #fff; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  @media (max-width: 520px) { .row b { width: 100%; } button { padding: 6px 10px; font-size: 13px; } header p { display: none; } }
</style>
<div id="backdrop"></div>
<div id="shade"></div>
<canvas id="stage" aria-label="The Moonlight Witch, turning slowly on a rug"></canvas>
<header>
  <h1>The Moonlight Witch</h1>
  <p>A plum hat with cream horns and silver charms, round glasses, long wavy hair, a magenta shawl stitched with gold, a black dress, buckled boots, her athame and her basket.</p>
</header>
<section id="panel" aria-label="Try her out">
  <div class="row"><b>Move</b>
    <button id="m-idle" data-group="move" aria-pressed="true">Stand</button>
    <button id="m-walk" data-group="move" aria-pressed="false">Walk</button>
    <button id="m-harvest">Gather an herb</button>
    <button id="m-cast">Witchfire</button>
    <button id="m-cheer">Cheer</button>
  </div>
  <div class="row"><b>Face</b>
    <button id="f-calm" data-group="face" aria-pressed="true">Calm</button>
    <button id="f-happy" data-group="face" aria-pressed="false">Happy</button>
    <button id="f-surprised" data-group="face" aria-pressed="false">Surprised</button>
  </div>
  <div class="row"><b>View</b>
    <button id="v-spin" aria-pressed="true">Turn</button>
    <button id="v-game" aria-pressed="false">Game camera</button>
    <button id="v-pixels">Pixels off</button>
  </div>
</section>
<!-- /PAGE -->
<script type="module" src="dev/viewer.js"></script>
</html>
